<!DOCTYPE html>
<html>

<head>
    <title id="title">Iniciar Sesion</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="theme-color" content="#1FA2FF" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .ad-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0,0,0);
        }

        #ad-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: 1001;
        }

        #skip-ad-button {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid white;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1002;
        }
    </style>
</head>

<body>
    <div id="ad-modal" class="ad-modal">
        <video id="ad-video" autoplay muted playsinline>
            <source src="anuncio.mp4" type="video/mp4">
            Su navegador no soporta la etiqueta de vídeo.
        </video>
        <button id="skip-ad-button">Saltar Anuncio</button>
    </div>

  <div class="bg">
    
        $(if chap-id)
        <form name="sendin" action="$(link-login-only)" method="post">
            <input type="hidden" name="username" />
            <input type="hidden" name="password" />
            <input type="hidden" name="dst" value="$(link-orig)" />
            <input type="hidden" name="popup" value="true" />
        </form>

        <script type="text/javascript" src="md5.js"></script>
        <script type="text/javascript">
            function doLogin() {
                document.sendin.username.value = document.login.username.value;
                document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value +
                    '$(chap-challenge)');
                document.sendin.submit();
                return false;
            }
        </script>
        $(endif)
          
            <div id="main" class="main">
            
            <div class="box">
                 <img src="img/logo.png" alt="kemangi 41" style="border-radius: 5px; width:200px; height:auto;"/> 
            </div>
            <div class="container">
            <div class="box">
                <button id="btnvrc" class="small-button" onclick="voucher();"><i class="icon icon-ticket">&#xe802;</i> Voucher</button>
                <button id="btnmem" class="small-button" onclick="member();"><i class="icon icon-user-circle-o">&#xf2be;</i> Miembro</button>
                <button id="qr" class="small-button" onclick="window.location='https://laksa19.github.io/myqr';"> <i class="icon icon-qrcode">&#xe801;</i> Codigo QR</button>
            </div>
            <div class="box" id="infologin"></div>

            <form autocomplete="off" name="login" action="$(link-login-only)" method="post" $(if chap-id) onSubmit="return doLogin()"
                $(endif)>
                <input type="hidden" name="dst" value="$(link-orig)" />
                <input type="hidden" name="popup" value="true" />
                <input class="username" name="username" type="text" value="$(username)" />
                <input class="password" name="password" placeholder="Password" type="hidden" />
                $(if error)<div class="notice">$(error)</div>$(endif)
                <button class="button" type="submit"><i class="icon icon-login">&#xe803;</i> Iniciar Sesion</button>

            </form>

            $(if trial == 'yes')
            <div class="box">Internet Gratis <a style="text-decoration: underline; color:#000;" href="#" onclick="showAdModal(); return false;">haga clic en aquí</a></div>
            $(endif)
                <br />
            <div>
                Los Vaucher los puedes comprar por whatsapp 5748-2508
            </div>
        </div>
        </div>
        <br />
        <div class="box" style="color:#000;">
            <i>Copyright &copy; 2025</i><br />
            <i>Powered by </i><a id="mikhmon" style="color:#000; text-decoration:underline; display:block" href="https://www.instagram.com/aldairg_97/">Mikhmon</a>
            <!-- Tolong jangan dihilangkan bagian ini-->
        </div>
        </div>

<script type="text/javascript">
var hostname = window.location.hostname;
document.getElementById('title').innerHTML = hostname  + " > login";

document.login.username.focus();

var config = {
    loginvc : "Introduzca el codigo del vaucher y haga clic en iniciar sesion.",
    loginup : "Introduzca su nombre de usuario y contraseña<br> y haga clic en iniciar sesion.",
    voucherCode : "Vucher",
    setCase : "false", // lowercase, uppercase or false
    defaultMode : "voucher", // voucher or member

}

        function showAdModal() {
            document.getElementById('ad-modal').style.display = 'block';
            document.getElementById('ad-video').play();

            setTimeout(function() {
                document.getElementById('skip-ad-button').style.display = 'block';
            }, 300000);
        }

        function redirectToLogin() {
            window.location.href = "$(link-login-only)?dst=$(link-orig-esc)&username=T-$(mac-esc)";
        }

        document.getElementById('skip-ad-button').addEventListener('click', redirectToLogin);
        document.getElementById('ad-video').addEventListener('ended', redirectToLogin);
        document.getElementById('ad-video').addEventListener('error', redirectToLogin);


</script>

</body>

</html>
