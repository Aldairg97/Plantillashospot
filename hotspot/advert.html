<!DOCTYPE html>
<html>
<head>
    <title>Anuncio</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #ad-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -100;
        }
        #skip-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid white;
            border-radius: 5px;
            cursor: pointer;
            display: none; /* Hidden by default */
            z-index: 100;
        }
    </style>
</head>
<body>

    <video id="ad-video" autoplay muted playsinline>
        <source src="anuncio.mp4" type="video/mp4">
        Su navegador no soporta la etiqueta de vídeo.
    </video>

    <button id="skip-button">Saltar Anuncio</button>

    <script type="text/javascript">
        // Function to parse URL parameters
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // Get parameters from URL
        const dst = getQueryParam('dst');
        const login_url = getQueryParam('login_url');
        const username = getQueryParam('username');

        // Construct the final login URL
        const final_login_url = `${login_url}?dst=${dst}&username=${username}`;

        const video = document.getElementById('ad-video');
        const skipButton = document.getElementById('skip-button');

        // Function to redirect
        function redirectToLogin() {
            window.location.href = final_login_url;
        }

        // Show skip button after 5 minutes (300000 milliseconds)
        setTimeout(() => {
            skipButton.style.display = 'block';
        }, 300000);

        // Add event listeners
        skipButton.addEventListener('click', redirectToLogin);
        video.addEventListener('ended', redirectToLogin);

    </script>

</body>
</html>
